[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evemex-trading-bot"
version = "0.1.0"
description = "Cliente não oficial da Evemex e robô M1 de reversão de três velas"
requires-python = ">=3.11"
dependencies = ["selenium>=4.20", "keyring>=25"]

[tool.setuptools.packages.find]
include = ["evemexapi*"]

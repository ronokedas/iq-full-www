[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polarium-full"
version = "1.0.0"
description = "Robô de trading automatizado para a Polarium Broker"
authors = [{ name = "Polarium Team" }]
requires-python = ">=3.10"
dependencies = [
    "keyring>=24.0.0",
    "pynacl>=1.5.0",
    "pandas>=2.0.0",
]
